# Native prek configuration for wslarc.
# Hook repositories are pinned to immutable tags; bump them together with uv.lock.
minimum_prek_version = "0.5.0"

# uv.lock points at public PyPI. Without this, a machine whose uv default index
# is a private mirror reports the lock as out of date in the uv-lock hook.
# `uv check` starts its own uv subprocess, so a flag would not reach it.
default_env = { UV_DEFAULT_INDEX = "https://pypi.org/simple" }

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=500"]

[[repos.hooks]]
id = "detect-private-key"

# Keep rev in step with ruff in uv.lock.
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.4"

[[repos.hooks]]
id = "ruff-check"
args = ["--fix", "--exit-non-zero-on-fix"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
require_serial = true

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.7"

[[repos.hooks]]
id = "uv-lock"
args = ["--check"]

[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "v0.27"

[[repos.hooks]]
id = "validate-pyproject"

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"

# ty is the fast checker and runs on pre-commit; keep its rev in step with ty in
# uv.lock. It reads its file set from pyproject.toml, so no filenames are passed.
[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.100"

[[repos.hooks]]
id = "ty"

# mypy stays the strict gate the repository documents: it checks the whole `files`
# set from pyproject.toml from pyproject.toml, so filenames are not
# passed through: a change in one module can break a caller in another.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "mypy"
name = "mypy"
language = "system"
entry = "uv run --frozen mypy"
types = ["python"]
pass_filenames = false
always_run = true
require_serial = true

# pytest imports the project's dependencies, so it runs in the project's uv
# environment. Tests are fast, but they stay on pre-push.
[[repos.hooks]]
id = "pytest"
name = "pytest"
language = "system"
entry = "uv run --frozen pytest -q"
types = ["python"]
pass_filenames = false
stages = ["pre-push"]
