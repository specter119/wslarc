[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wslarc"
version = "0.1.0"
description = "WSL2 Btrfs backup and restore tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tomli-w>=1.0",
]

[project.scripts]
wslarc = "wslarc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/wslarc"]

[dependency-groups]
build = [
    "nuitka[onefile]>=2.6",
    "patchelf>=0.17",
]
# Installed by `uv sync` without flags: the tools the README's development
# checks and the prek hooks run.
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
    "ty>=0.0.100",
]
